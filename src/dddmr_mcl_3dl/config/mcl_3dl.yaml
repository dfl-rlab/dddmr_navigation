dddmr_pg_map_server_manager:
  ros__parameters:
    maps: ["map1"]

map1:
  ros__parameters:
    pose_graph_dir: "/root/dddmr_bags/terminal_t3_pg"
    complete_map_voxel_size: 0.3 #this is for whole map resolution, not for localization, the resolution of localization is in submap

sub_maps:
  ros__parameters:
    pg_map_server_name: "map1" #options from line#3
    sub_map_search_radius: 40.0
    sub_map_warmup_trigger_distance: 20.0
    submap_resolution: 0.1 #localization map resolution

mcl_3dl:
  ros__parameters:
    init_x: 64.3
    init_y: -8.9
    init_z: -1.8
    init_roll: 0.0
    init_pitch: 0.0
    init_yaw: -0.4774
    init_var_x: 2.0
    init_var_y: 2.0
    init_var_z: 0.5
    init_var_roll: 0.1
    init_var_pitch: 0.1
    init_var_yaw: 0.5
    map_frame: "map"
    robot_frame: "base_link"
    odom_frame: "odom"
    num_particles: 150
    draw_flat_feature_bin_size_x: 2.0
    draw_flat_feature_bin_size_y: 2.0
    draw_flat_feature_bin_size_z: 2.0
    voxel_size_before_bin_sampling: 0.5

    resample_var_x: 0.2
    resample_var_y: 0.2
    resample_var_z: 0.05
    resample_var_yaw: 0.2
    resample_var_pitch: 0.00
    resample_var_roll: 0.00
    expansion_var_x: 0.5
    expansion_var_y: 0.5
    expansion_var_z: 0.5
    expansion_var_roll: 0.2
    expansion_var_pitch: 0.2
    expansion_var_yaw: 0.2
    match_ratio_thresh: 0.0

    euc_cluster_distance: 0.8
    euc_cluster_min_size: 3
    euc_cluster_max_size: 5000 #for jt128

    knn_num_of_ground_normals: 20

    update_min_d: 0.2
    update_min_a: 0.1

    odom_err_lin_lin: 0.6
    odom_err_lin_ang: 0.1
    odom_err_ang_lin: 0.1
    odom_err_ang_ang: 0.6

    odom_err_integ_lin_tc: 5.0
    odom_err_integ_ang_tc: 10.0

    lpf_step: 2.0
    acc_lpf_step: 128.0

    jump_dist: 1.0
    jump_ang: 1.57

    bias_var_dist: 2.0
    bias_var_ang: 1.57
    tf_tolerance: 0.1
    publish_tf: true

    likelihood:
      num_points_global: 8
      match_dist_min: 0.3
      match_dist_flat: 0.05
      threshold_for_trusted_ground: 6
      radius_of_ground_search: 1.0