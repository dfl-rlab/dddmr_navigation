mcl_3dl_test_node:
  ros__parameters:
    use_sim_time: true
    init_x: 0.0
    init_y: 0.0
    init_z: 0.0
    init_ox: 0.0
    init_oy: 0.0
    init_oz: 0.0
    init_ow: 1.0
    target_x: 12.6
    target_y: -17.15
